  ['performance',/performance|퍼포먼스|choreography|dance (?:practice|video|ver)|舞蹈版|vertical video|special music clip/i],
  ['mv',/music video|뮤직비디오|(?:^|[^a-z])m\s*\/?\s*v(?:[^a-z]|$)|MIRAE.*(?:Marvelous|Drip N' Drop|Snow Prince|JUMP!|RUNNING UP)|^Suzy - 간절한 소원|^YOO TAE YANG.*OFFICIAL VIDEO/i]
];
const categoryOverrides = new Map([
  ['AVXvYqP_BKA','performance'],
  ['3sthHeHUEd0','performance'],
  ['2Sc_auiBVA4','performance'],
  ['ag3Gx252JDA','performance'],
  ['_8I-VTtToOg','performance'],
  ['tqMJGsg7jwY','performance'],
  ['U-Ea_UaSt3E','performance'],
  ['RPyBq7ePpn0','performance'],
  ['3AqH01Q0GGk','performance'],
  ['hITgpO3TbGo','performance'],
  ['3bGWxZlECG0','performance'],
  ['7azTqStBZ_A','performance'],
  ['JL29kd0zMSU','performance'],
  ['9OG-Mqygf-0','performance'],
  ['_mj1iW_IAWc','brand'],
  ['KFVpG8bebx8','performance'],
  ['4uBT_rmxD-s','mv'], ['DgcLePhVSxE','mv'], ['HybjG5IqxSI','mv'],
  ['JSiVlIpg9QM','mv'], ['WZ_GNJdIJik','mv'], ['Kdubj6Rr-wE','mv'],
  ['9jmjSzhH18g','mv'], ['NkqnRT8fl-g','mv'],
  ['RonLaNbwN2g','live'], ['a0bc6Ownyt0','live'], ['6fJhuKXPU20','live'],
  ['W3YLtvqa718','live'],
  ['z6jfoQP3HoQ','performance'], ['hOqMlt-LyPo','performance'],
  ['CPzxuHAnMOc','performance'], ['3uOW8gZlf3k','performance'],
  ['YNGZ1dbNAqY','teaser'], ['5fvze8wg-mc','teaser']
]);
for(const work of works){
  const matched = formatRules.find(([,pattern])=>pattern.test(work.title))?.[0];
  const isYoutube = work.source==='youtube';
  const sketch = /촬영 스케치|performance video sketch/i.test(work.title);
  const campaign = /서울예술인희망캠페인|국정과제|2025추경|공연 스팟/i.test(work.title);
  const inferred = isYoutube
    ? (sketch ? 'behind' : campaign ? 'brand' : matched ?? 'youtube')
    : matched ?? 'other';
  work.category = categoryOverrides.get(work.id) ?? inferred;
}
for(const work of works){
  if(work.category==='live' && /concert|콘서트|festival|world tour|fan meeting|stage w|transmedia/i.test(work.title)){
    work.category='concert';
  }
}
const newest = sorted.find(work=>work.category==='mv');
const exportTemplate = document.documentElement.cloneNode(true);
const readOnly = document.documentElement.hasAttribute('data-readonly');
const storageKey = 'yoo-jung-woo-portfolio-roles-v1';
const roleNames = ['제작','편집'];
const embeddedRoles = JSON.parse(document.querySelector('#saved-roles').textContent);
let localRoles = {};
if(!readOnly){
  try { localRoles = JSON.parse(localStorage.getItem(storageKey)||'{}') || {}; } catch {}
}
const roleEdits = {};
for(const work of works){
  const saved = localRoles[work.id] ?? embeddedRoles[work.id];
  if(Array.isArray(saved)){
    work.roles = roleNames.filter(role=>saved.includes(role));
    roleEdits[work.id] = work.roles;
  }
}
const editButton = document.querySelector('#edit-roles');
const exportButton = document.querySelector('#export-roles');
const editStatus = document.querySelector('#edit-status');
const search = document.querySelector('#work-search');
let editing = false;
function saveRoles(work,choices,roleText){
  work.roles = roleNames.filter((role,index)=>choices[index].checked);
  roleEdits[work.id] = work.roles;
  roleText.textContent = work.roles.join(' · ')||'담당 역할 확인 중';
  
  try {
    localStorage.setItem(storageKey,JSON.stringify(roleEdits));
    editStatus.textContent = '이 브라우저에 저장했습니다.';
  } catch {
    editStatus.textContent = '브라우저 저장을 사용할 수 없습니다. 수정본 HTML을 내려받아 보관하세요.';
  }
}
function roleEditor(work,roleText){
  const group=element('fieldset');
  group.className='role-editor';
  group.append(element('legend','담당 역할'));
  const choices=roleNames.map(role=>{
    const label=element('label');
    const input=element('input');
    input.type='checkbox';
    input.checked=work.roles.includes(role);
    input.setAttribute('aria-label',work.title+' '+role);
    label.append(input,document.createTextNode(role));
    group.append(label);
    return input;
  });
  choices.forEach(input=>input.addEventListener('change',()=>saveRoles(work,choices,roleText)));
  return group;
}
function downloadPortfolio(forSharing){
  const page = exportTemplate.cloneNode(true);
  page.querySelector('#saved-roles').textContent = JSON.stringify(roleEdits).replaceAll('<','\\u003c');
  if(forSharing){
    page.setAttribute('data-readonly','');
    page.querySelector('.editor-bar').remove();
    page.querySelector('#editor-search').remove();
  }
  const html = '<!doctype html>\n'+page.outerHTML;
  const url = URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const link = element('a');
  link.href = url;
  link.download = forSharing ? 'portfolio-share.html' : 'portfolio-preview.html';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
exportButton?.addEventListener('click',()=>downloadPortfolio(false));
document.querySelector('#share-portfolio')?.addEventListener('click',()=>downloadPortfolio(true));

const projects = document.querySelector('#projects');
function element(tag,text){
  const node=document.createElement(tag);
  if(text) node.textContent=text;
  return node;
}
function workView(work,featured){
  const wrap=element(featured?'div':'article');
  if(!featured) wrap.className='card';
  const url='https://www.youtube.com/watch?v='+work.id;
  const thumbnail=element('a');
  thumbnail.href=url;
  thumbnail.className='thumbnail';
  thumbnail.setAttribute('aria-label',work.title+' 재생');
  const image=element('img');
  image.src='https://i.ytimg.com/vi/'+work.id+'/hq720.jpg';
  image.alt='';
  image.loading=featured?'eager':'lazy';
  image.onerror=()=>{image.onerror=null;image.src='https://i.ytimg.com/vi/'+work.id+'/hqdefault.jpg'};
  thumbnail.append(image);
  const details=element('div');
  details.className='details';
  if(featured){
    const label=element('span','최신 공개 작품');
    label.className='accent';
    details.append(label);
  }
  const date=element('time',work.published);
  date.dateTime=work.published;
  const roles=element('p',work.roles.join(' · ')||'담당 역할 확인 중');
  roles.className='muted';
  const watch=element('a','YouTube에서 보기');
  watch.href=url;
  watch.className='watch';
  const heading=element(featured?'h2':'h3');
  if(featured){
    heading.textContent=work.title;
  }else{
    const titleLink=element('a',work.title);
    titleLink.href=url;
    heading.append(titleLink);
  }
  details.append(heading);
  if(work.published) details.append(date);

  const format=element('p',categoryLabels.get(work.category));
  format.className='muted';
  details.append(format,roles);
  if(featured) details.append(watch);
  else if(editing) details.append(roleEditor(work,roles));
  if(featured) return [thumbnail,details];
  wrap.append(thumbnail,details);
  return wrap;
}

const more = document.querySelector('#more');
const pageSize = 24;
let matches = [];
let shown = 0;
function appendPage(){
  const page = matches.slice(shown,shown+pageSize);
  projects.append(...page.map(work=>workView(work,false)));
  shown += page.length;
  more.hidden = shown>=matches.length;
  more.textContent = `작품 더 보기 (${shown}/${matches.length})`;
}
let activeCategory = 'mv';
let activeRole = '';
function render(){
  const query = editing ? search.value.trim().toLowerCase() : '';
  matches = sorted.filter(work =>
    (activeCategory==='all'||work.category===activeCategory) &&
    (editing||!activeRole||work.roles.includes(activeRole)) &&
    (!query||work.title.toLowerCase().includes(query)));
  shown = 0;
  projects.replaceChildren();
  if(!matches.length) projects.append(element('p','선택한 조건에 해당하는 작품이 없습니다.'));
  appendPage();
}
more.addEventListener('click',appendPage);
const categoryGroup = document.querySelector('#categories');
for(const [key,label] of categories){
  const count = key==='all' ? works.length : works.filter(work=>work.category===key).length;
  const button = element('button',label+' '+count);
  button.type = 'button';
  button.setAttribute('aria-pressed',String(key===activeCategory));
  button.addEventListener('click',()=>{
    activeCategory = key;
    for(const item of categoryGroup.children) item.setAttribute('aria-pressed',String(item===button));
    render();
  });
  categoryGroup.append(button);
}
const roleButtons = document.querySelectorAll('#roles button');
roleButtons.forEach(button=>button.addEventListener('click',()=>{
  activeRole = button.dataset.role;
  roleButtons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  render();
}));
editButton?.addEventListener('click',()=>{
  editing = !editing;
  editButton.setAttribute('aria-pressed',String(editing));
  editButton.textContent = editing ? '편집 완료' : '역할 편집';
  exportButton.hidden = !editing;
  document.querySelector('#editor-search').hidden = !editing;
  document.querySelector('#roles').hidden = editing;
  editStatus.textContent = editing ? '작품별로 맡은 역할을 선택하세요.' : '';
  render();
});
search?.addEventListener('input',render);
render();
</script>
</html>
